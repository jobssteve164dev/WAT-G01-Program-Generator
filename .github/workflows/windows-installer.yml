name: Windows offline installer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'backend/pyproject.toml'
      - 'backend/wat_pilot/**'
      - 'frontend/**'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: python -m unittest discover -s packaging/windows -p test_account.py
      - run: python packaging/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-under-test
          path: output/windows/WAT-G01-Setup-x64.exe
          if-no-files-found: error
          retention-days: 1
  windows-test:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-under-test
          path: installer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright pywin32
      - name: Install and check the Start menu shortcut
        shell: pwsh
        run: |
          $installer = (Resolve-Path installer/WAT-G01-Setup-x64.exe).Path
          $app = "$env:LOCALAPPDATA\Programs\WAT G01\python.exe"
          New-NetFirewallRule -DisplayName WAT-Setup-Offline -Program $installer -Direction Outbound -Action Block
          New-NetFirewallRule -DisplayName WAT-Offline -Program $app -Direction Outbound -Action Block
          $result = Start-Process $installer -ArgumentList /S -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed" }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'WAT G-01 工作台.lnk'
          if (!(Test-Path -LiteralPath $link)) {
            throw "Missing shortcut at $link. Installed links: $(Get-ChildItem (Split-Path $link) -Filter 'WAT*.lnk' -Name)"
          }
          "WAT_SHORTCUT=$link" >> $env:GITHUB_ENV
      - run: python packaging/windows/smoke.py
      - name: Uninstall and check that user data survives
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\WAT G01"
          $result = Start-Process "$dir\Uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path "$dir\python.exe")) { throw "Uninstall failed" }
          if (!(Test-Path "$env:LOCALAPPDATA\WAT G01\data\workbench.sqlite3")) { throw "Missing user data" }
      - uses: actions/upload-artifact@v4
        with:
          name: WAT-G01-Windows-x64
          path: installer/WAT-G01-Setup-x64.exe
          if-no-files-found: error
