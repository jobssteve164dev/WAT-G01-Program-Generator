services:
  wat-g01:
    build:
      context: .
    image: wat-g01-pilot:0.1.0
    ports:
      - "127.0.0.1:${WAT_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).status == 200"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
