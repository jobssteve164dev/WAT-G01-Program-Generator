x-gitops:
  public_entry:
    service: wat-g01
    container_port: 8080
    healthcheck:
      path: /api/health
      expected_json:
        status: ok
        mode: replay

services:
  wat-g01:
    platform: linux/amd64
    build:
      context: .
    image: wat-g01-pilot:0.1.0
    ports:
      - "127.0.0.1:${WAT_PORT:-8080}:8080"
    environment:
      WAT_G0_ADMIN_USERNAME: ${WAT_G0_ADMIN_USERNAME:-}
      WAT_G0_ADMIN_HASH: ${WAT_G0_ADMIN_HASH:-}
      WAT_G0_ORIGIN: ${WAT_G0_ORIGIN:-http://localhost:${WAT_PORT:-8080}}
    volumes:
      - workbench-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).status == 200"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  workbench-data:
    name: ${WAT_DATA_VOLUME:-wat-g01-workbench-data}
